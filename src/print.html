<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data:;" />
  <title>Lamplight</title>
  <link rel="stylesheet" href="../node_modules/@fontsource/courier-prime/400.css" />
  <link rel="stylesheet" href="../node_modules/@fontsource/courier-prime/700.css" />
  <link rel="stylesheet" href="../node_modules/@fontsource/nanum-gothic-coding/400.css" />
  <link rel="stylesheet" href="../node_modules/@fontsource/nanum-gothic-coding/700.css" />
  <link rel="stylesheet" href="doc.css" />
  <style>
    @page { size: A4; margin: 0; }
    html, body { margin: 0; background: #fbf8f0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    /* A soft paper tone with a quiet edge, like the sheet in the app. */
    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse 140% 80% at 50% 0%, rgba(255, 255, 255, 0.6), transparent 70%),
        #fbf8f0;
    }
    main { padding: 22mm 20mm 20mm; }
    .doc { font-size: 11pt; }
    .doc h1 { font-size: 19pt; }
    .doc h2 { font-size: 13pt; break-after: avoid; }
    .doc h3 { break-after: avoid; }
    .doc li, .doc p { break-inside: avoid; }
    footer { position: fixed; bottom: 9mm; left: 0; right: 0; text-align: center; font: 8pt 'Courier Prime', monospace; letter-spacing: 0.2em; color: #b3aa9b; }
  </style>
</head>
<body>
  <main><article class="doc" id="doc"></article></main>
  <footer>LAMPLIGHT</footer>
</body>
</html>

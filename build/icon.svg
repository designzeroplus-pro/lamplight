<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2825"/>
      <stop offset="1" stop-color="#0d0c0b"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46423e"/>
      <stop offset=".55" stop-color="#121110"/>
      <stop offset="1" stop-color="#262422"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4744"/>
      <stop offset=".5" stop-color="#262422"/>
      <stop offset="1" stop-color="#161514"/>
    </linearGradient>
    <radialGradient id="litFade" cx="612" cy="690" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="612" cy="690" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe2b4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffb070" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="glow" x="-100%" y="-300%" width="300%" height="700%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".5"/></filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <mask id="beam" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#000"/>
      <path d="M612 690 L94 645 A520 520 0 0 1 872 240 Z" fill="url(#litFade)" filter="url(#blur)"/>
      <ellipse cx="420" cy="664" rx="300" ry="46" fill="#fff" opacity=".7" filter="url(#blur)"/>
    </mask>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>

  <g clip-path="url(#tile)">
    <!-- the sheet, in the dark -->
    <rect x="232" y="196" width="560" height="760" rx="8" fill="#34302c"/>
    <!-- the same sheet where the lamp reaches -->
    <g mask="url(#beam)">
      <rect x="232" y="196" width="560" height="760" rx="8" fill="#e9e2d4"/>
      <g fill="#2a2622">
        <rect x="292" y="300" width="300" height="22" rx="11"/>
        <rect x="292" y="372" width="96" height="18" rx="9" fill="#a5301f"/>
        <rect x="402" y="372" width="250" height="18" rx="9"/>
        <rect x="292" y="432" width="380" height="18" rx="9"/>
        <rect x="292" y="492" width="320" height="18" rx="9"/>
        <rect x="292" y="552" width="230" height="18" rx="9"/>
        <rect x="292" y="612" width="270" height="18" rx="9"/>
      </g>
    </g>
    <!-- warm air in the beam -->
    <path d="M612 690 L94 645 A520 520 0 0 1 872 240 Z" fill="url(#warm)" filter="url(#blur)"/>

    <!-- rail -->
    <rect x="150" y="700" width="724" height="24" rx="12" fill="url(#rail)"/>
    <!-- lamp -->
    <rect x="603" y="628" width="18" height="70" rx="9" fill="#2a2826"/>
    <rect x="554" y="612" width="116" height="22" rx="11" fill="#ffcf87" filter="url(#glow)"/>
    <rect x="560" y="616" width="104" height="14" rx="7" fill="#fff4dc"/>
    <rect x="527" y="676" width="170" height="72" rx="36" fill="url(#body)"/>
    <rect x="528.5" y="677.5" width="167" height="69" rx="34.5" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="3"/>
    <circle cx="566" cy="712" r="8" fill="#7ad87a"/>
    <circle cx="566" cy="712" r="14" fill="#7ad87a" opacity=".3" filter="url(#glow)"/>
  </g>
</svg>
